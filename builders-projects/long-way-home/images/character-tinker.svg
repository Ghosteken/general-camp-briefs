<!--
  FILE: character-tinker.svg
  WHY: The fourth playable hero, finishing the set of four using the same
       simple shape recipe as the others.
  WHAT: Echo the Tinker - Echo builds the gadgets (including Pip, the AI
       companion players meet in the AI Pathfinding section), so their
       ability icon is a little gear/cog.
  HOW: Same face shapes as before. The gear icon is just one circle in
       the middle with four small rectangles pointing outwards - no
       rotation maths needed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Echo the Tinker character artwork">
  <rect width="300" height="300" rx="24" fill="#0b1b33" />
  <circle cx="150" cy="120" r="90" fill="#4fc3f7" opacity="0.18" />
  <circle cx="150" cy="120" r="90" fill="#ff7a29" opacity="0.1" />

  <!-- Hood / cloak -->
  <polygon points="150,48 214,142 86,142" fill="#142a4d" />

  <!-- Face -->
  <circle cx="150" cy="152" r="46" fill="#eaf2fb" />
  <circle cx="131" cy="148" r="6" fill="#0b1b33" />
  <circle cx="169" cy="148" r="6" fill="#0b1b33" />
  <path d="M133,172 Q150,184 167,172" stroke="#0b1b33" stroke-width="4" fill="none" stroke-linecap="round" />

  <!-- Ability icon: a simple gear, top-right corner -->
  <rect x="233" y="40" width="8" height="10" fill="#ff7a29" />
  <rect x="233" y="70" width="8" height="10" fill="#ff7a29" />
  <rect x="218" y="55" width="10" height="8" fill="#ff7a29" />
  <rect x="248" y="55" width="10" height="8" fill="#ff7a29" />
  <circle cx="238" cy="59" r="14" fill="#0b1b33" stroke="#ff7a29" stroke-width="2" />
  <circle cx="238" cy="59" r="5" fill="#4fc3f7" />

  <text x="150" y="248" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff">ECHO</text>
  <text x="150" y="273" font-family="Arial, sans-serif" font-size="15" letter-spacing="2" text-anchor="middle" fill="#4fc3f7">THE TINKER</text>
</svg>