<!--
  FILE: hero-map.svg
  WHY: The Hero section (the big banner at the top of the page) needs an
       adventurous illustration. Rather than searching the internet for a
       picture, we draw a night-time map scene ourselves with SVG shapes.
  WHAT: A starry navy sky, a glowing sun/moon, layered mountains, a
        winding dashed trail with two glowing landmark dots, a "Start"
        flag at the bottom and a "Home" house near the top.
  HOW: <circle> makes the stars, the glow, and the sun. <polygon> makes
       the mountains, the flag and the house roof. <path> draws the
       winding trail using curve instructions (the letters "M" and "C"
       just mean "move to this point" and "curve to this point").
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of a winding trail through the mountains at night, leading home">
  <defs>
    <radialGradient id="sky-glow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#142a4d" />
      <stop offset="60%" stop-color="#0b1b33" />
      <stop offset="100%" stop-color="#060f1f" />
    </radialGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9b8" />
      <stop offset="45%" stop-color="#ff7a29" />
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Night sky background -->
  <rect x="0" y="0" width="1200" height="900" fill="url(#sky-glow)" />

  <!-- Scattered stars -->
  <circle cx="120" cy="90" r="3" fill="#eaf2fb" opacity="0.8" />
  <circle cx="260" cy="150" r="2" fill="#eaf2fb" opacity="0.6" />
  <circle cx="420" cy="70" r="2.5" fill="#eaf2fb" opacity="0.7" />
  <circle cx="600" cy="120" r="2" fill="#eaf2fb" opacity="0.5" />
  <circle cx="760" cy="60" r="3" fill="#eaf2fb" opacity="0.8" />
  <circle cx="940" cy="140" r="2" fill="#eaf2fb" opacity="0.6" />
  <circle cx="1080" cy="80" r="2.5" fill="#eaf2fb" opacity="0.7" />
  <circle cx="150" cy="260" r="2" fill="#eaf2fb" opacity="0.5" />
  <circle cx="1000" cy="230" r="2" fill="#eaf2fb" opacity="0.5" />

  <!-- Glowing sun / moon -->
  <circle cx="900" cy="200" r="150" fill="url(#sun-glow)" />
  <circle cx="900" cy="200" r="46" fill="#ffe8d1" />

  <!-- Distant mountains (darker, further away) -->
  <polygon points="0,620 180,420 360,620" fill="#0b1b33" />
  <polygon points="260,620 480,380 700,620" fill="#0b1b33" />
  <polygon points="620,620 850,440 1080,620" fill="#0b1b33" />

  <!-- Nearer mountains (lighter, closer) -->
  <polygon points="-20,700 220,480 480,700" fill="#142a4d" />
  <polygon points="380,700 640,460 900,700" fill="#142a4d" />
  <polygon points="760,700 1000,500 1220,700" fill="#142a4d" />

  <!-- The winding trail home, drawn as a dashed curved path -->
  <path d="M120,820 C 260,760 200,660 340,640 C 520,615 480,520 660,510 C 800,502 760,380 900,260"
        fill="none" stroke="#ff7a29" stroke-width="8" stroke-linecap="round"
        stroke-dasharray="18 14" />

  <!-- Landmark glow-dots along the trail -->
  <circle cx="340" cy="640" r="10" fill="#4fc3f7" opacity="0.9" />
  <circle cx="660" cy="510" r="10" fill="#4fc3f7" opacity="0.9" />

  <!-- Start flag -->
  <rect x="118" y="790" width="6" height="40" fill="#eaf2fb" />
  <polygon points="124,792 160,802 124,812" fill="#ff7a29" />

  <!-- Home, near the top of the trail -->
  <rect x="880" y="230" width="60" height="45" fill="#eaf2fb" />
  <polygon points="875,230 910,195 945,230" fill="#ff7a29" />
</svg>